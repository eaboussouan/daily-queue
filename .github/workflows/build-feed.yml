name: build-feed
on:
  push:
    paths:
      - "episodes/**"
      - "audio/**"
      - "scripts/build_feed.py"
  workflow_dispatch:
concurrency:
  group: build-feed
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build feed.xml
        run: python3 scripts/build_feed.py
      - name: Commit and push if changed
        run: |
          git config user.name "feed-builder[bot]"
          git config user.email "feed-builder@users.noreply.github.com"
          git add feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild feed.xml"
            git pull --rebase origin main
            git push origin main
          fi
